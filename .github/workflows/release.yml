name: Release

# Runs when a version tag is pushed. Tags are only ever created on `main`
# (see docs/RELEASING.md); the release step below enforces that.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must match the workspace version
        run: |
          # The root [package] inherits (`version.workspace = true`); the
          # real number is the quoted one under [workspace.package].
          version=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}
      # The installer is attached to the release as well as living on
      # `main`, so there is a URL that can never change under someone:
      # .../releases/download/<tag>/install.sh. The release notes are the
      # changelog section plus a fixed "how to install" footer.
      - name: Attach the installer and say how to use it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" install.sh --clobber
          gh release view "$TAG" --json body -q .body > notes.md
          cat .github/release-install.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  upload-binaries:
    name: build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: notopod
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
