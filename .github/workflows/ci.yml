name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck install.sh
      # The script people are told to pipe into their shell gets run for
      # real, against a real release, on every push.
      - name: Installs a release and explains itself
        run: |
          sh install.sh --help | grep -q -- '--version'
          sh install.sh --frobnicate 2>&1 | grep -q 'unknown option'
          dir=$(mktemp -d)
          sh install.sh --to "$dir" --version v0.3.0
          "$dir/notopod" --version
          # And through a pipe, the way the README says to run it.
          cat install.sh | sh -s -- --to "$dir/piped"
          "$dir/piped/notopod" --version

  msrv:
    name: minimum supported rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs
      - run: nix flake check --print-build-logs
      - name: Smoke test the built binary
        run: ./result/bin/notopod render README.md --width 60 --no-color | head -20
