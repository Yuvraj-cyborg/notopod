name: Publish crates

# Manual. Publishes every crate to crates.io in dependency order.
# Needs a CARGO_REGISTRY_TOKEN repository secret. Run it from the tag
# you released (choose the tag under "Use workflow from").
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check that publishing would work
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          for crate in notopad-core notopad-render notopad-editor notopad-tui notopad; do
            echo "::group::$crate"
            # A dry run of a crate whose dependencies are not on crates.io yet
            # cannot resolve them; only the leaf crate is checked in that case.
            if [ -n "$flag" ] && [ "$crate" != "notopad-core" ]; then
              echo "skipped in dry run (depends on unpublished crates)"
            else
              cargo publish -p "$crate" $flag
            fi
            echo "::endgroup::"
          done
