[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/notopad/notopad"
homepage = "https://github.com/notopad/notopad"
keywords = ["notes", "markdown", "tui", "editor", "terminal"]
categories = ["text-editors", "command-line-utilities"]

[workspace.dependencies]
# Internal crates. Version + path so they can be published to crates.io
# individually while the workspace always builds against the local copy.
notopad-core = { version = "0.1.0", path = "crates/notopad-core" }
notopad-render = { version = "0.1.0", path = "crates/notopad-render" }
notopad-editor = { version = "0.1.0", path = "crates/notopad-editor" }
notopad-tui = { version = "0.1.0", path = "crates/notopad-tui" }

# External
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
tempfile = "3.20"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noisier than they are useful for this codebase.
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
